<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Cart | Buxar Marketplace | TheBuxar.com</title>
    <link rel="canonical" href="https://www.thebuxar.com/marketplace/cart.html" />
    <noscript><meta http-equiv="refresh" content="0; url=../cart.html" /></noscript>
    <script>
      // Pretty-URL preparation for /marketplace/cart/.
      (function () {
        // Everything up to and including /marketplace/ resolves the
        // flat template regardless of how deep the pretty URL is.
        var mroot = location.pathname.match(/^.*\/marketplace\//);
        var root = mroot ? mroot[0] : '../';
        location.replace(root + 'cart.html');
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="../cart.html">cart.html</a>...</p>
  </body>
</html>
